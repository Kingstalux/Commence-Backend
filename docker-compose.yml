version: "3.8"

services:
  mongodb:
    image: mongo:4.4
    container_name: commence-mongodb
    hostname: mongodb
    network_mode: host
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongo-init:/docker-entrypoint-initdb.d
    command: ["mongod", "--bind_ip_all", "--port", "27017"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
